<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><title>Spoiler Shield</title></head>
<body class="popup">
  <header class="brand"><img src="icons/icon128.png" alt="GTA 6 Spoiler Shield logo"><div><h1>GTA 6 Spoiler Shield</h1><p class="muted">Stay spoiler-free.</p></div></header>

</body></html>
